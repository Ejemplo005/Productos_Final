# ==========================================================
# Base de datos H2 EN MEMORIA
# ==========================================================
# No hace falta instalar MySQL, XAMPP ni ningun motor de base
# de datos externo: H2 se crea sola, dentro del mismo proceso
# de Java, cuando arranca la aplicacion, y se destruye cuando
# la aplicacion se detiene.
#
# DB_CLOSE_DELAY=-1  -> mantiene la base viva mientras la app
#                       este corriendo (si no, Spring podria
#                       cerrarla entre una conexion y otra).
spring.datasource.url=jdbc:h2:mem:tienda_sahumerios;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Como la base es en memoria, se recrea desde cero cada vez que
# se inicia la aplicacion (create-drop): Hibernate crea las
# tablas al arrancar y las borra al apagar. Los datos de prueba
# los carga DataInitializer en cada arranque.
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# Consola web de H2 (opcional, para inspeccionar la base)
# ==========================================================
# Con la app corriendo, entrando a http://localhost:8080/h2-console
# se puede ver y consultar la base de datos en vivo desde el navegador.
# JDBC URL a usar en esa pantalla: jdbc:h2:mem:tienda_sahumerios
# Usuario: sa / Password: (vacio)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
